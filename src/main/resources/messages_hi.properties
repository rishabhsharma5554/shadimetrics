planner.eyebrow=एआई वेडिंग प्लानर
planner.title=60 सेकंड में अपनी व्यक्तिगत शादी योजना पाएं
planner.desc=कुछ त्वरित प्रश्नों के उत्तर दें — हम तुरंत आपके उत्सव के लिए एक यथार्थवादी बजट विभाजन और सही सेवाएं सुझाएंगे।
planner.step1.title=आप कितने मेहमानों की उम्मीद कर रहे हैं?
planner.step1.desc=इससे हमें वेन्यू, केटरिंग और बैठने की योजना सही आकार में तैयार करने में मदद मिलती है।
planner.step2.title=आपका कुल बजट क्या है?
planner.step2.desc=अनुमानित आंकड़े भी ठीक हैं — यह पूरी योजना को आकार देता है।
planner.step3.title=कहां और कब?
planner.step3.desc=ताकि हम वेन्यू और वेंडर की उपलब्धता जांच सकें।
planner.step4.title=हम आपकी योजना कहां भेजें?
planner.step4.desc=हम इसका उपयोग आपकी छोटी परिचयात्मक कॉल बुक करने के लिए भी करेंगे।
