feature.structured.title=संरचित योजना
feature.structured.desc=हर शादी अनोखी होती है। हम आपकी सोच के अनुसार विस्तृत समय-सारणी, चेकलिस्ट और मील के पत्थर तैयार करते हैं।
feature.budget.title=पारदर्शी बजट
feature.budget.desc=जानिए हर रुपया कहां जा रहा है। कोई छिपा खर्च नहीं, कोई आश्चर्य नहीं — बस स्पष्ट, ईमानदार आंकड़े।
feature.execution.title=बेदाग निष्पादन
feature.execution.desc=पहली रस्म से लेकर आखिरी नृत्य तक, हम सुनिश्चित करते हैं कि हर पल वैसे ही हो जैसी योजना बनी थी।

services.eyebrow=हमारी सेवाएं
services.title=आपकी शादी के लिए हर वो चीज़ जो चाहिए
services.desc=प्यार से तैयार और सटीकता से निष्पादित शादी योजना सेवाओं का पूरा सेट।
