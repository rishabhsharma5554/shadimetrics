process.eyebrow=हम कैसे काम करते हैं
process.title=हमारे साथ आपकी यात्रा
process.desc=आपके शादी के सपनों को हकीकत में बदलने के लिए एक सरल, संरचित 4-चरण प्रक्रिया।
process.step1.title=परामर्श
process.step1.desc=हम आपके सपनों को सुनते हैं, आपकी सोच को समझते हैं, और एक व्यक्तिगत योजना बनाते हैं।
process.step2.title=बजट योजना
process.step2.desc=विस्तृत विवरण के साथ पारदर्शी लागत — हर रुपये का हिसाब।
process.step3.title=वेंडर समन्वय
process.step3.desc=हम सर्वश्रेष्ठ वेंडर चुनते और प्रबंधित करते हैं ताकि आपको चिंता न करनी पड़े।
process.step4.title=निष्पादन
process.step4.desc=बड़े दिन पर, हम सब कुछ संभालते हैं ताकि आप हर पल पूरी तरह जी सकें।

