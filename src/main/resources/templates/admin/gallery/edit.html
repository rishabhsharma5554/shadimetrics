<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{admin/fragments/head :: head('Edit Photo')}"></head>
<body class="admin-body">

<aside th:replace="~{admin/fragments/sidebar :: sidebar('gallery')}"></aside>

<main class="admin-main">
    <div class="admin-topbar">
        <h1>Edit Gallery Photo</h1>
        <a th:href="@{/admin/gallery}" class="btn-sm btn-sm-ghost">← Back to Gallery</a>
    </div>

    <div class="admin-content">
        <div class="admin-card" style="max-width:640px;">
            <img th:src="@{${image.imagePath}}" style="width:100%; max-width:280px; border-radius:14px; margin-bottom:22px;" />
            <form th:action="@{/admin/gallery/{id}(id=${image.id})}" method="post">
                <div class="form-grid">
                    <div class="admin-field">
                        <label for="category">Category</label>
                        <select id="category" name="category" required>
                            <option th:each="cat : ${categories}" th:value="${cat.name()}" th:text="${cat.label}"
                                    th:selected="${cat == image.category}"></option>
                        </select>
                    </div>
                    <div class="admin-field">
                        <label for="sortOrder">Sort Order</label>
                        <input type="number" id="sortOrder" name="sortOrder" th:value="${image.sortOrder}" />
                    </div>
                    <div class="admin-field full">
                        <label for="caption">Caption</label>
                        <input type="text" id="caption" name="caption" th:value="${image.caption}" />
                    </div>
                    <div class="admin-field checkbox full">
                        <input type="checkbox" id="featured" name="featured" value="true" th:checked="${image.featured}" />
                        <label for="featured" style="margin:0;">Feature on homepage</label>
                    </div>
                </div>
                <button type="submit" class="btn btn-gold" style="margin-top:22px;">Save Changes</button>
            </form>
        </div>
    </div>
</main>

</body>
</html>
