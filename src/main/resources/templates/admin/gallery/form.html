<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{admin/fragments/head :: head('Add Photo')}"></head>
<body class="admin-body">

<aside th:replace="~{admin/fragments/sidebar :: sidebar('gallery')}"></aside>

<main class="admin-main">
    <div class="admin-topbar">
        <h1>Add Gallery Photo</h1>
        <a th:href="@{/admin/gallery}" class="btn-sm btn-sm-ghost">← Back to Gallery</a>
    </div>

    <div class="admin-content">
        <div class="admin-card" style="max-width:640px;">
            <div class="flash flash-error" th:if="${error}" th:text="${error}"></div>
            <form th:action="@{/admin/gallery}" method="post" enctype="multipart/form-data">
                <div class="form-grid">
                    <div class="admin-field full">
                        <label for="file">Photo</label>
                        <input type="file" id="file" name="file" accept="image/*" required />
                    </div>
                    <div class="admin-field">
                        <label for="category">Category</label>
                        <select id="category" name="category" required>
                            <option th:each="cat : ${categories}" th:value="${cat.name()}" th:text="${cat.label}"></option>
                        </select>
                    </div>
                    <div class="admin-field">
                        <label for="sortOrder">Sort Order</label>
                        <input type="number" id="sortOrder" name="sortOrder" value="0" />
                    </div>
                    <div class="admin-field full">
                        <label for="caption">Caption (optional)</label>
                        <input type="text" id="caption" name="caption" placeholder="e.g. Royal mandap at Hotel Sayaji" />
                    </div>
                    <div class="admin-field checkbox full">
                        <input type="checkbox" id="featured" name="featured" value="true" />
                        <label for="featured" style="margin:0;">Feature on homepage</label>
                    </div>
                </div>
                <button type="submit" class="btn btn-gold" style="margin-top:22px;">Upload Photo</button>
            </form>
        </div>
    </div>
</main>

</body>
</html>
