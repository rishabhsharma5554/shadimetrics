<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('AI Wedding Planner | Shaadi Metrics', 'Answer a few quick questions and get an instant, personalized wedding budget and service plan from Shaadi Metrics.')}"></head>
<body>

<header th:replace="~{fragments/header :: header}"></header>

<section class="planner-hero">
    <div class="container">
        <div class="eyebrow reveal" style="justify-content:center;color:var(--gold-300);" th:text="#{planner.eyebrow}">AI Wedding Planner</div>
        <h1 class="reveal" th:text="#{planner.title}">Get Your Personalized Wedding Plan in 60 Seconds</h1>
        <p class="reveal" th:text="#{planner.desc}">Description</p>
    </div>
</section>

<section style="padding-top:60px;">
    <div class="container" style="max-width:820px;">
        <form th:action="@{/planner}" method="post">

            <div class="planner-card reveal">
                <h3><span class="planner-step-num">1</span> <span th:text="#{planner.step1.title}">How many guests are you expecting?</span></h3>
                <p th:text="#{planner.step1.desc}">Description</p>
                <div class="choice-grid">
                    <label class="choice-card"><input type="radio" name="guestCount" value="UNDER_150" required /><span class="emoji">🎊</span>Under 150</label>
                    <label class="choice-card"><input type="radio" name="guestCount" value="150_300" /><span class="emoji">💐</span>150 – 300</label>
                    <label class="choice-card"><input type="radio" name="guestCount" value="300_500" /><span class="emoji">🎉</span>300 – 500</label>
                    <label class="choice-card"><input type="radio" name="guestCount" value="ABOVE_500" /><span class="emoji">👑</span>500+</label>
                </div>
            </div>

            <div class="planner-card reveal">
                <h3><span class="planner-step-num">2</span> <span th:text="#{planner.step2.title}">What's your overall budget range?</span></h3>
                <p th:text="#{planner.step2.desc}">Description</p>
                <div class="choice-grid">
                    <label class="choice-card"><input type="radio" name="budgetRange" value="UNDER_10L" required />₹ Under 10L</label>
                    <label class="choice-card"><input type="radio" name="budgetRange" value="10_20L" />₹10L – 20L</label>
                    <label class="choice-card"><input type="radio" name="budgetRange" value="20_40L" />₹20L – 40L</label>
                    <label class="choice-card"><input type="radio" name="budgetRange" value="ABOVE_40L" />₹40L+</label>
                </div>
            </div>

            <div class="planner-card reveal">
                <h3><span class="planner-step-num">3</span> <span th:text="#{planner.step3.title}">Where &amp; when?</span></h3>
                <p th:text="#{planner.step3.desc}">Description</p>
                <div class="planner-form-grid">
                    <div class="planner-field">
                        <label for="city">City / Preferred Venue Area</label>
                        <input type="text" id="city" name="city" placeholder="e.g. Indore" />
                    </div>
                    <div class="planner-field">
                        <label for="weddingDate">Tentative Wedding Date</label>
                        <input type="text" id="weddingDate" name="weddingDate" placeholder="e.g. Feb 2027" />
                    </div>
                </div>
            </div>

            <div class="planner-card reveal">
                <h3><span class="planner-step-num">4</span> <span th:text="#{planner.step4.title}">Where should we send your plan?</span></h3>
                <p th:text="#{planner.step4.desc}">Description</p>
                <div class="planner-form-grid">
                    <div class="planner-field">
                        <label for="name" th:text="#{modal.name}">Your Name</label>
                        <input type="text" id="name" name="name" required placeholder="Priya Sharma" />
                    </div>
                    <div class="planner-field">
                        <label for="phone" th:text="#{modal.phone}">Phone Number</label>
                        <input type="tel" id="phone" name="phone" required placeholder="+91 98xxxxxxx" />
                    </div>
                    <div class="planner-field full" style="grid-column:1/-1;">
                        <label for="preferredCallTime">Best Time for a Short 15-Min Call</label>
                        <select id="preferredCallTime" name="preferredCallTime">
                            <option value="" th:text="#{modal.calltime.none}">No preference</option>
                            <option value="Morning (9am - 12pm)" th:text="#{modal.calltime.morning}">Morning (9am - 12pm)</option>
                            <option value="Afternoon (12pm - 4pm)" th:text="#{modal.calltime.afternoon}">Afternoon (12pm - 4pm)</option>
                            <option value="Evening (4pm - 8pm)" th:text="#{modal.calltime.evening}">Evening (4pm - 8pm)</option>
                        </select>
                    </div>
                </div>
            </div>

            <button type="submit" class="btn btn-gold btn-block reveal" th:text="#{planner.submit}">✨ Get My Personalized Plan</button>
        </form>
    </div>
</section>

<footer th:replace="~{fragments/footer :: footer}"></footer>

</body>
</html>
