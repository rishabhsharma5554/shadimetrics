<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet">
  <!-- Circular background -->
  <circle cx="50" cy="50" r="48" fill="#FDF9F2" stroke="#D4AF37" stroke-width="1.5"/>

  <!-- Mandap design group -->
  <g transform="translate(50, 50)">
    <!-- Decorative wreath circle -->
    <circle cx="0" cy="0" r="35" fill="none" stroke="#D4AF37" stroke-width="1" opacity="0.4"/>

    <!-- Left leaf cluster -->
    <g transform="translate(-22, -8)">
      <path d="M0,0 Q-4,-3 -5,-8 Q-2,-5 0,-8" fill="#C9A961" opacity="0.7"/>
      <path d="M2,-2 Q-2,-5 -2,-10 Q1,-6 2,-10" fill="#D4AF37" opacity="0.6"/>
      <path d="M-1,3 Q-5,-1 -7,-4 Q-3,0 -4,-4" fill="#C9A961" opacity="0.7"/>
    </g>

    <!-- Right leaf cluster -->
    <g transform="translate(22, -8)">
      <path d="M0,0 Q4,-3 5,-8 Q2,-5 0,-8" fill="#C9A961" opacity="0.7"/>
      <path d="M-2,-2 Q2,-5 2,-10 Q-1,-6 -2,-10" fill="#D4AF37" opacity="0.6"/>
      <path d="M1,3 Q5,-1 7,-4 Q3,0 4,-4" fill="#C9A961" opacity="0.7"/>
    </g>

    <!-- Rose flowers -->
    <!-- Left rose -->
    <g transform="translate(-18, 12)">
      <circle cx="0" cy="0" r="4.5" fill="#C8697B" opacity="0.85"/>
      <circle cx="-1.5" cy="-1" r="2.8" fill="#D99CA8" opacity="0.8"/>
      <circle cx="1.5" cy="-1" r="2.8" fill="#D99CA8" opacity="0.8"/>
      <circle cx="0" cy="1" r="2" fill="#E8BBCA" opacity="0.7"/>
    </g>

    <!-- Right rose -->
    <g transform="translate(18, 12)">
      <circle cx="0" cy="0" r="4.5" fill="#C8697B" opacity="0.85"/>
      <circle cx="-1.5" cy="-1" r="2.8" fill="#D99CA8" opacity="0.8"/>
      <circle cx="1.5" cy="-1" r="2.8" fill="#D99CA8" opacity="0.8"/>
      <circle cx="0" cy="1" r="2" fill="#E8BBCA" opacity="0.7"/>
    </g>

    <!-- Mandap (Wedding Canopy) structure -->
    <!-- Dome/arch -->
    <path d="M -12,-12 Q -12,-22 0,-26 Q 12,-22 12,-12" fill="none" stroke="#D4AF37" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Pillars -->
    <rect x="-10" y="-10" width="1.5" height="10" fill="#D4AF37" opacity="0.9"/>
    <rect x="8.5" y="-10" width="1.5" height="10" fill="#D4AF37" opacity="0.9"/>

    <!-- Top decorative elements -->
    <circle cx="-5" cy="-20" r="1.2" fill="#D4AF37"/>
    <circle cx="0" cy="-22" r="1.2" fill="#D4AF37"/>
    <circle cx="5" cy="-20" r="1.2" fill="#D4AF37"/>

    <!-- Hanging decorations (vertical lines) -->
    <line x1="-6" y1="-8" x2="-6" y2="2" stroke="#D4AF37" stroke-width="1" opacity="0.6"/>
    <line x1="0" y1="-10" x2="0" y2="2" stroke="#D4AF37" stroke-width="1" opacity="0.6"/>
    <line x1="6" y1="-8" x2="6" y2="2" stroke="#D4AF37" stroke-width="1" opacity="0.6"/>

    <!-- Hanging bells/decorations -->
    <circle cx="-6" cy="4" r="1.5" fill="#D4AF37" opacity="0.8"/>
    <circle cx="0" cy="4.5" r="1.5" fill="#D4AF37" opacity="0.8"/>
    <circle cx="6" cy="4" r="1.5" fill="#D4AF37" opacity="0.8"/>

    <!-- Decorative swirl at bottom -->
    <path d="M -8,20 Q -4,18 0,20 Q 4,18 8,20" fill="none" stroke="#D4AF37" stroke-width="1" opacity="0.5" stroke-linecap="round"/>

    <!-- Center accent -->
    <circle cx="0" cy="-8" r="1.5" fill="#2C0812" opacity="0.6"/>
  </g>
</svg>