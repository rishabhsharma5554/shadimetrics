# Production Profile for Railway - Uses H2 Database

# Server Configuration
server.port=8080
server.servlet.context-path=/

# H2 Database - File-based with persistence
# Railway provides /railway/volumes for persistent storage
spring.datasource.url=jdbc:h2:file:/railway/volumes/data/shaadimetrics;AUTO_SERVER=TRUE;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# H2 Console (optional - disable in production for security)
spring.h2.console.enabled=false

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Thymeleaf Configuration
spring.thymeleaf.cache=true
spring.web.resources.cache.period=31536000

# File Upload Configuration
app.uploads.dir=/railway/volumes/uploads
spring.servlet.multipart.max-file-size=15MB
spring.servlet.multipart.max-request-size=15MB

# Admin Seeding
app.seed.admin-username=admin
app.seed.admin-password=ShaadiAdmin@2026

# Internationalization
spring.messages.basename=messages
spring.messages.encoding=UTF-8
spring.messages.fallback-to-system-locale=false

# Logging
logging.level.root=INFO
logging.level.com.shaadimetrics=INFO

# Connection Pool
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=20000
