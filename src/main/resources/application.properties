spring.application.name=website
server.port=8080
spring.thymeleaf.cache=false
spring.web.resources.cache.period=3600

# File-based H2 database - data persists in ./data/ across restarts
spring.datasource.url=jdbc:h2:file:./data/shaadimetrics;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Uploaded admin content (gallery photos added via the admin panel) lives outside the jar
app.uploads.dir=./uploads
spring.servlet.multipart.max-file-size=15MB
spring.servlet.multipart.max-request-size=15MB

# Default super-admin bootstrapped on first run if no users exist yet
app.seed.admin-username=admin
app.seed.admin-password=ShaadiAdmin@2026

# i18n - English (default) + Hindi, switch via ?lang=en / ?lang=hi
spring.messages.basename=messages
spring.messages.encoding=UTF-8
spring.messages.fallback-to-system-locale=false
