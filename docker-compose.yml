services:
  shaadimetrics:
    build: .
    image: shaadimetrics-website:latest
    ports:
      - "8080:8080"
    volumes:
      - ./data:/app/data
      - ./uploads:/app/uploads
    environment:
      # Change these before first run in any real deployment.
      - APP_SEED_ADMIN_USERNAME=admin
      - APP_SEED_ADMIN_PASSWORD=ShaadiAdmin@2026
    restart: unless-stopped
